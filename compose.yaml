# Pinned loopback-only service stack.
#
# Every HTTP listener binds 127.0.0.1 on the host (host networking is
# mandatory: bridge containers cannot reach host loopback services such as
# 3x-ui and subconverter).  Security comes from explicit loopback binding
# plus the absence of any published Docker port, never from port mapping.
services:
  subconverter:
    # Digest-pinned MetaCubeX subconverter; the pref.ini mount replaces the
    # image default at /base/pref.ini (the image layout mirrors base/).
    image: ghcr.io/metacubex/subconverter:0.9.2@sha256:58c26f49010c0c069a5b20c85e7f1ac909da8ef704650b34f5001dd84cb9f7b9
    network_mode: host
    # nobody: the listener only needs the world-readable pref.ini and the
    # unprivileged port 25500.
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # Request targets contain the private source URLs; never persist them.
    logging:
      driver: none
    volumes:
      - ./config/subconverter/pref.ini:/base/pref.ini:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:25500/version >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  publisher:
    build:
      context: .
      dockerfile: Dockerfile
    image: clash-sub/app:local
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    command: ["clash_sub.publisher"]
    environment:
      PUBLISHER_LISTEN: "127.0.0.1"
      PRIVATE_ROOT: /app/private
    # Read-only views of exactly what publication needs: settings, the
    # current links, and the immutable releases.  No sources, no staging.
    volumes:
      - ./private/config:/app/private/config:ro
      - ./private/current:/app/private/current:ro
      - ./private/releases:/app/private/releases:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:25501/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  manager:
    build:
      context: .
      dockerfile: Dockerfile
    image: clash-sub/app:local
    # Host networking reaches the loopback 3x-ui subscription endpoints and
    # subconverter; the manager itself starts no listener.
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # `docker compose run --rm -T manager <args>` appends the arguments
    # here, so the module CLI receives them verbatim.
    entrypoint: ["python", "-m", "clash_sub.manager"]
    # Read-write private root: staging, releases, current links, sources,
    # and the operation log all live under the ignored host directory.
    volumes:
      - ./private:/app/private
    tmpfs:
      - /tmp

  validator:
    image: docker.io/metacubex/mihomo:v1.19.30
    # `-t` parses the candidate and exits before provider initialization,
    # so the validator needs no network at all.
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # The candidate mount must expose the staging tree at the same path the
    # manager reports in its build payload, because the host CLI passes
    # that string verbatim to `docker compose run --rm -T validator -t -f`.
    entrypoint: ["/mihomo"]
    volumes:
      - ./private:/app/private:ro
    tmpfs:
      - /root/.config/mihomo
