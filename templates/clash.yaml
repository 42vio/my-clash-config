mixed-port: 7890

allow-lan: true

bind-address: '*'

mode: rule

log-level: info

ipv6: false

external-controller: 127.0.0.1:9090

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  prefer-h3: false
  listen: 0.0.0.0:53
  enhanced-mode: fake-ip
  use-system-hosts: false
  cache-algorithm: arc
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - geosite:private
  - +.lan
  - +.local
  - +.msftconnecttest.com
  - +.msftncsi.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - +.xboxlive.com
  - xbox.*.microsoft.com
  - +.hitrontech.com
  - +.420615.xyz
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  respect-rules: true
  nameserver:
  - https://1.1.1.1/dns-query
  - https://8.8.8.8/dns-query
  nameserver-policy:
    geosite:private,cn:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
    +.hitrontech.com:
    - 172.28.30.211
    - 172.28.30.210
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  direct-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  direct-nameserver-follow-policy: true

proxies: []

proxy-groups:
- type: select
  proxies:
  - 自动选择
  - 🇭🇰 香港节点
  - 🇯🇵 日本节点
  - 🇺🇲 美国节点
  - 🇨🇳 台湾节点
  - 🇸🇬 新加坡节点
  name: 加速线路
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
- type: url-test
  url: http://www.google.com/generate_204
  interval: 1800
  tolerance: 50
  name: 自动选择
  exclude-filter: 流量|到期|剩余|官网|过期
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
  include-all: true
- type: select
  proxies:
