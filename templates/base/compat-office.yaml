# dns 泄漏解决原理
# https://v2ex.com/t/1137959
# https://github.com/clash-verge-rev/clash-verge-rev/discussions/2526
# https://blog.arisa.moe/blog/2025/250814-best-practice-of-anti-dns-leak/#24-dns


# 方案5 Practical
# 默认国内 DNS + 国外 Policy + 混合 Resolve, Windows推荐

mixed-port: 7890     # HTTP 代理端口
allow-lan: true      # 允许局域网连接
bind-address: "*"    # 地址绑定
mode: rule           # 规则模式
log-level: info      # 日志级别
ipv6: false          # IPV6开关
external-controller: 127.0.0.1:9090

# sniffer:
#   enable: true
#   force-dns-mapping: true
#   override-destination: true
#   sniff:
#     TLS:
#       ports: [443]
#       override-destination: true

profile:
  store-selected: true
  # store-fake-ip: true

dns:
  enable: true
  ipv6: false
  prefer-h3: false

  listen: 0.0.0.0:53 # dns 监听
  enhanced-mode: fake-ip
  use-system-hosts: false
  cache-algorithm: arc
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - "geosite:private"
  - "geosite:category-education-cn"
  - "+.push.apple.com"
  - "+.market.xiaomi.com"
  - "*.lan"
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.xboxlive.com
  - msftconnecttest.com
  - xbox.*.microsoft.com
  - "*.battlenet.com.cn"
  - "*.battlenet.com"
  - "*.blzstatic.cn"
  - "*.battle.net"
  - "+.hitrontech.com"
  - "+.42io.cc"

  # 用于解析 DoH 服务器自身域名等基础解析
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29

  # 默认解析器：未知域名也从这里解析。
  # 这样未知国内域名第一次即可获得更合理的国内线路 / CDN。
  nameserver:  # 默认 DNS 服务
  - https://223.5.5.5/dns-query   #阿里DoH
  - https://doh.pub/dns-query   #腾讯DoH，因腾讯云即将关闭免费版IP访问，故用域名
  # 特定域名 DNS 分流
  nameserver-policy:
    "+.hitrontech.com":
    - 172.28.30.211
    - 172.28.30.210

    # 已知国外 / 敏感域名 → 海外 DNS，并强制通过代理访问 DNS。
    "geosite:gfw,geolocation-!cn":
    - https://1.1.1.1/dns-query#加速线路
    - https://8.8.8.8/dns-query#加速线路

  # 代理节点域名，如果不写，就会回退到 nameserver-policy → nameserver → fallback。
  proxy-server-nameserver:
  - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query


