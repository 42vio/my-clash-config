# 2025/07/05 墨鱼 https://github.com/ddgksf2013/Profile/blob/master/ClashVergeforWindows.yaml  𝐡𝐭𝐭𝐩𝐬://𝐭.𝐦𝐞/𝐝𝐝𝐠𝐤𝐬𝐟𝟐𝟎𝟐𝟏
# https://github.com/Aethersailor/Custom_OpenClash_Rules/blob/main/cfg/yaml/Custom_Clash_Selfhosted_Provider_Fallback.yaml

# dns 泄漏解决原理
# https://v2ex.com/t/1137959
# https://github.com/clash-verge-rev/clash-verge-rev/discussions/2526
# https://blog.arisa.moe/blog/2025/250814-best-practice-of-anti-dns-leak/#24-dns

mixed-port: 7890     # HTTP 代理端口
allow-lan: true      # 允许局域网连接
bind-address: "*"    # 地址绑定
mode: rule           # 规则模式
log-level: info      # 日志级别
ipv6: false          # IPV6开关
external-controller: 127.0.0.1:9090

# GEO 数据每 7 天自动更新（间隔单位：小时）
geo-auto-update: true
geo-update-interval: 168

profile:
  store-selected: true
  store-fake-ip: true

dns:
  enable: true
  ipv6: false
  prefer-h3: false

  listen: 0.0.0.0:53 # dns 监听
  enhanced-mode: fake-ip
  use-system-hosts: false
  cache-algorithm: arc
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - "geosite:private"
  - "geosite:category-education-cn"
  - "+.push.apple.com"
  - "+.market.xiaomi.com"
  - "*.lan"
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - localhost.work.weixin.qq.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - +.msftconnecttest.com
  - +.msftncsi.com
  - +.xboxlive.com
  - msftconnecttest.com
  - xbox.*.microsoft.com
  - "*.battlenet.com.cn"
  - "*.battlenet.com"
  - "*.blzstatic.cn"
  - "*.battle.net"
  - "+.hitrontech.com"
  - "+.hitroncloud.cn"
  - "+.42io.cc"

  # 用于解析 DoH 服务器自身域名等基础解析
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29

  # 默认解析器：未知域名也从这里解析。
  # 这样未知国内域名第一次即可获得更合理的国内线路 / CDN。
  nameserver:  # 默认 DNS 服务
    # - https://223.5.5.5/dns-query #阿里DoH 个人域名和部分域名有问题 dash.augmunt.com
  - https://doh.pub/dns-query   #腾讯DoH，因腾讯云即将关闭免费版IP访问，故用域名
  - https://doh.360.cn/dns-query

  # 特定域名 DNS 分流
  nameserver-policy:
    "+.hitrontech.com,+.hitroncloud.cn":
    - 172.28.30.211
    - 172.28.30.210

    # 已知国外 / 敏感域名 → 海外 DNS，并强制通过代理访问 DNS。
    "geosite:gfw,geolocation-!cn":
    - https://1.1.1.1/dns-query#加速线路
    - https://8.8.8.8/dns-query#加速线路


  # 代理节点域名，如果不写，就会回退到 nameserver-policy → nameserver → fallback。
  proxy-server-nameserver:
    # - https://223.5.5.5/dns-query
  - https://doh.pub/dns-query
  - https://doh.360.cn/dns-query


#========= 建立锚点 =========#
auto: &auto {type: url-test, url: https://www.gstatic.com/generate_204, expected-status: 204, interval: 1800, tolerance: 50, empty-fallback: REJECT, exclude-filter: "流量|到期|剩余|官网|过期"}                  # 自动测速组基底
fallback: &fallback {type: fallback, url: https://www.gstatic.com/generate_204, expected-status: 204, interval: 600, lazy: true}
select: &select {type: select}
sub-select: {type: select, use: [Subscribe]}                  # 手动切换（订阅全列）
direct-first: &direct-first {type: select, proxies: [DIRECT, 加速线路]}  # 直连优先 + 加速
proxy-first: &proxy-first {type: select, proxies: [加速线路, DIRECT]}    # 加速优先
rule: &rule {type: http, behavior: classical, interval: 86400}                  # classical 规则集基底
mrs: &mrs {type: http, behavior: domain, format: mrs, interval: 86400}

proxies: []
icons:
  proxy: &icon-proxy https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Proxy.png
  auto: &icon-auto https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
  pt: &icon-pt https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Media.png
  ai: &icon-ai https://raw.githubusercontent.com/Orz-3/mini/master/Color/OpenAI.png
  game: &icon-game https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Game.png
  steam: &icon-steam https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Steam.png
  bilibili: &icon-bilibili https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/bilibili.png
  # china-media:  &icon-china-media  https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/DomesticMedia.png
  global-media: &icon-global-media https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ForeignMedia.png
  apple: &icon-apple https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
  google: &icon-google https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Google_Search.png
  microsoft: &icon-microsoft https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Microsoft.png
  speedtest: &icon-speedtest https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Speedtest.png
  global: &icon-global https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png
  ads: &icon-ads https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Advertising.png
  final: &icon-final https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Final.png

proxy-groups:
#节点分组（订阅按地区自动测速 / 手动切换；自建节点单列）
- {name: 加速线路, type: select, proxies: [自动选择, 🏴‍☠️ 自建节点, 🇭🇰 香港节点, 🇯🇵 日本节点, 🇺🇲 美国节点, 🇨🇳 台湾节点, 🇸🇬 新加坡节点], icon: *icon-proxy}
- {name: 自动选择, <<: *auto, icon: *icon-auto}
- {name: 🏴‍☠️ 自建节点, <<: *fallback, proxies: []}
- {name: PT服务, <<: *direct-first, icon: *icon-pt}
- {name: AI服务, <<: *select, proxies: [🏴‍☠️ 自建节点, 🇺🇲 美国节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点], icon: *icon-ai}
- {name: 游戏直连, <<: *select, proxies: [DIRECT], icon: *icon-game}
- {name: Steam, <<: *direct-first, icon: *icon-steam}
- {name: BiliBili, <<: *direct-first, icon: *icon-bilibili}
- {name: 国外流媒体, <<: *proxy-first, icon: *icon-global-media}
- {name: 苹果服务, <<: *direct-first, icon: *icon-apple}
- {name: 谷歌服务, <<: *proxy-first, icon: *icon-google}
- {name: 微软服务, <<: *direct-first, icon: *icon-microsoft}
- {name: 测速工具, <<: *direct-first, icon: *icon-speedtest}
- {name: 国外网站, <<: *proxy-first, icon: *icon-global}
- {name: 广告隐私, <<: *select, proxies: [DIRECT, REJECT, 加速线路], icon: *icon-ads}
- {name: 🐟 Final, <<: *direct-first, icon: *icon-final}
- {name: 🇭🇰 香港节点, <<: *auto, filter: "港|HK|(?i)Hong", hidden: true}
- {name: 🇯🇵 日本节点, <<: *auto, filter: "日|东京|JP|(?i)Japan", hidden: true}
- {name: 🇺🇲 美国节点, <<: *auto, filter: "美|US|(?i)States|American", hidden: true}
- {name: 🇨🇳 台湾节点, <<: *auto, filter: "台|湾|TW|(?i)Taiwan", hidden: true}
- {name: 🇸🇬 新加坡节点, <<: *auto, filter: "新|坡|SG|(?i)Singapore", hidden: true}

