add-proxy-groups:
- type: fallback
  name: HomeServer
  proxies:
  - 🎯 Direct
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Back.png
- type: select
  name: ProxyServer
  proxies:
  - 🎯 Direct
  - HomeServer
  icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/SSID.png
extend-proxy-groups:
  BiliBili:
  - ProxyServer
  PT站加速:
  - ProxyServer
  国内流媒体:
  - ProxyServer
prepend-rules:
- IP-CIDR,192.168.2.0/24,HomeServer,no-resolve
inject-node-groups:
- ProxyServer
inject-home-node-groups:
- HomeServer
