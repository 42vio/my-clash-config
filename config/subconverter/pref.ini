# Pinned MetaCubeX subconverter v0.9.2 configuration.
# Option names follow the image's shipped base/pref.example.ini: the
# listener lives in [server]; api_mode/default_url live in [common].
[common]
; API mode refuses local file sources and direct file serving.
api_mode=true
; Never fall back to a default subscription source.
default_url=
; Never insert extra nodes into converted subscriptions.
enable_insert=false
; Never reload this configuration from a request.
reload_conf_on_request=false

[managed_config]
; Never append managed-config update headers to generated profiles.
write_managed_config=false

[rulesets]
; Never refresh remote rulesets on request.
update_ruleset_on_request=false

[server]
; Bind the loopback listener only; host networking exposes no Docker port.
listen=127.0.0.1
port=25500
; Empty root disables serving any local files over HTTP.
serve_file_root=
